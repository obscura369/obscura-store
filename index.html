<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBSCURA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
      color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      letter-spacing: 4px;
      margin-bottom: 10px;
      color: crimson;
      text-shadow: 0 0 20px crimson;
      animation: pulse 2.5s infinite alternate;
    }

    .typing {
      font-size: 1.3rem;
      color: #ccc;
      margin-bottom: 35px;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid crimson;
      width: 0;
      animation: typing 4s steps(40, end) forwards, blink 0.8s infinite;
    }

    img {
      width: 320px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      margin-bottom: 40px;
    }

    img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px crimson;
    }

    button {
      background: linear-gradient(to right, #ff0033, #cc0000);
      color: white;
      padding: 15px 70px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4);
      transition: all 0.3s ease-in-out;
    }

    button:hover {
      transform: scale(1.08);
      background: linear-gradient(to right, #cc0000, #990000);
      box-shadow: 0 0 30px crimson;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      0%, 100% { border-color: transparent }
      50% { border-color: crimson }
    }

    @keyframes pulse {
      from { text-shadow: 0 0 5px crimson; }
      to { text-shadow: 0 0 30px crimson; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.5rem; }
      .typing { font-size: 1rem; }
      img { width: 90%; }
      button { width: 90%; padding: 14px 0; font-size: 18px; }
    }
  </style>
</head>
<body>

  <h1>OBSCURA</h1>
  <div class="typing">Unleash the Darkness of Fashion...</div>

  <img src="https://i.postimg.cc/y6tQJGgG/Picsart-25-04-07-22-20-12-993.jpg" alt="OBSCURA Logo">

  <button onclick="window.location.href='https://www.instagram.com/obscura.castl?igsh=MWI3YTNvcXhxcnd5eQ==';">Open Store</button>

</body>
</html>
